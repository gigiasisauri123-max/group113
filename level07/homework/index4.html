<!-- რატომ ჰქვია HTML-ს Hypertext Markup Language?
HTML არის ინგლისური სიტყვების აბრევიატურა. თითოეულ სიტყვას თავისი მნიშვნელობა აქვს:

Hypertext (ჰიპერტექსტი) — ტექსტი, რომელიც შეიძლება შეიცავდეს ბმულებს (ლინკებს), რომელთა საშუალებითაც ერთი ვებგვერდიდან მეორეზე გადავდივართ. 

Markup (მონიშვნა) — HTML თეგების საშუალებით ვნიშნავთ და ვაწყობთ ვებგვერდის შინაარსს, მაგალითად, სათაურებს, აბზაცებს, სურათებსა და ბმულებს. 

language (ენა) — HTML არის ენა, რომლის საშუალებითაც ბრაუზერს ვეუბნებით, როგორ არის  ვებგვერდის შინაარსი.

რა არის Hyperlink?
Hyperlink (ჰიპერბმული) არის ბმული, რომელზე დაჭერითაც შეგვიძლია გადავიდეთ სხვა ვებგვერდზე, ფაილზე ან იმავე გვერდის კონკრეტულ ნაწილზე.-->

<!--რატომ არის Hyperlink მნიშვნელოვანი ქსელისთვის?
ჰიპერბმულები უმნიშვნელოვანესია, რადგან ისინი ერთმანეთთან აკავშირებს ვებგვერდებს და გვაძლევს ერთი გვერდიდან მეორეზე მარტივად გადასვლის საშუალებას. მათი დახმარებით ინტერნეტში ინფორმაცია ერთმანეთთან არის დაკავშირებული და მომხმარებელს შეუძლია სწრაფად მოიძიოს მისთვის საჭირო მასალა.

HTML ქმნის ვებგვერდის სტრუქტურას, ხოლო Hyperlink სხვადასხვა ვებგვერდსა და ინფორმაციას ერთმანეთთან აკავშირებს.-->
