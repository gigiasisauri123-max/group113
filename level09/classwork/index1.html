<!--2) შექმენით 2 ჩამონათავალი საიტზე. პირველი იქნება დალაგებული ordered list (ol) რომელშიც ჩამოწერეთ საიტიებს შესაქმნელად გამოყენბულ პროგრამირეიბს ენებს, თანმიმდევრობით. ხოლო მეორე გააკეთეთ დაულაგებელი სია რომელშიც ჩამოწერთ სხვადასხვა პროგრამირების ენებს-->
<html lang="en">
<head>
    <title>პროგრამირების ენები</title>
</head>
    <body>
        <H1>საიტის სექმნის ეტაპები</H1>
        <h2>დალაგერბული სია</h2>
        <ol>
            <li>html</li>
            <li>css</li>
            <li>javascript</li>
        </ol>
        <h2>დაულაგებელი სია</h2>
        <ul>
            <li>python</li>
            <li>java</li>
            <li>php</li>
            <li>c++</li>
        </ul>
    </body>
</html>
