<!-- 2) კომენტარების საშვალებით დაწერეთ რა არის ატრიბუტი, რომელი ატრიბუტები იცით და რაში გამოიყენებიან. მოიყვანეთ თითოეულზე მინიმუმ 1 მაგალითი. ახსენით რა არის aspect ratio და როგორ უნდა მოვიქცეთ სურათის ზომების შეცლისას ხარისხი რომ არ გაუარესდეს-->

<!-- ატრიბუტი არის HTML ელემენტებში მითითებული მნიშვნელობა, რომელიც განსაზღვრავს ელემენტის თვისებებს და ქცევას. მაგალითად, "src" ატრიბუტი მითითებს სურათის URL-ს, "alt" ატრიბუტი მოწყობს სურათის აღწერას, ხოლო "href" ატრიბუტი განსაზღვრავს ჰიპერბმულის მისამართს. -->

<!-- Aspect ratio არის სურათის ან ვიდეოს სიგანესა და სიმაღლის შეფარდება. მაგალითად, 16:9 არის გავრცელებული aspect ratio ვიდეოებისთვის. სურათის ზომების შეცვლისას ხარისხის შესანარჩუნებლად, საჭიროა გამოიყენოთ მაღალი რეზოლუციის სურათები და შეინარჩუნოთ aspect ratio, რათა სურათი არ დაიკარგოს ან არ დამახინჯდეს. -->

<html>
    <head>
        <title>My Page</title>
    </head>
        <body>
            <h1>Attributes and Aspect Ratio</h1>
            <img src="attributtes.jpg" alt="attributtes" width="500" height="300">
            <img src="aspect-ratio.jpg" alt="aspect ratio" width="500" height="300">
        </body>
</html>
